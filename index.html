<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice Megrashy WO</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf6f1;--card:#fff;--tx:#2f2a26;--mut:#7a6f66;--bd:#e6d9cb;--ac:#c98f5a;--acd:#a9733f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a17;--card:#292420;--tx:#f1e9e0;--mut:#b3a698;--bd:#443b33;--ac:#d9a06a;--acd:#e7b685}}
:root[data-theme="dark"]{--bg:#1d1a17;--card:#292420;--tx:#f1e9e0;--mut:#b3a698;--bd:#443b33;--ac:#d9a06a;--acd:#e7b685}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)}
header h1{font-size:17px;margin:0;margin-right:auto;color:var(--acd)}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
button.g{background:transparent;color:var(--acd);border:1px solid var(--bd)}button.x{background:transparent;color:#c0453a;padding:4px 8px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 9px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
main{display:grid;grid-template-columns:260px minmax(300px,420px) 1fr;gap:12px;padding:12px;align-items:start}
@media(max-width:1100px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.li{padding:9px;border:1px solid var(--bd);border-radius:10px;margin-top:7px;cursor:pointer;background:var(--bg)}.li.on{border-color:var(--ac);outline:2px solid var(--ac)}
.li b{display:block}.li small{color:var(--mut)}
.bd{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;margin-top:3px}
.b-menunggu{background:#fdebd3;color:#a65f0b}.b-dibayar{background:#d8f1d6;color:#25782a}.b-lunas{background:#d4e6fb;color:#1f5fa8}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:grid;gap:6px;grid-template-columns:1fr 120px 30px;margin-bottom:6px}
.prow{border:1px dashed var(--bd);border-radius:10px;padding:8px;margin-bottom:8px}
h3{margin:14px 0 6px;font-size:13px;color:var(--acd)}
.wrap{overflow-x:auto}
#paper{background:#fff;color:#333;padding:28px;min-width:620px;font-size:12.5px;position:relative;border:1px solid #ddd;border-radius:6px}
#paper table{width:100%;border-collapse:collapse}#paper th{background:#deb887;color:#fff;padding:8px;font-size:12px}
#paper td{border:1px solid #ccc;padding:7px 8px}#paper .r{text-align:right;white-space:nowrap}
#paper .tot td{background:#deb887;color:#fff;font-weight:700;border-color:#deb887}
.hd{display:flex;justify-content:space-between;gap:12px}.co{text-align:right}.co h2{margin:0;color:#e0b185;font-weight:400;font-size:22px}
.box{border:1px solid #f1d6bd;background:#fdfaf7;padding:10px;border-radius:4px;min-width:250px}
.stamp{position:absolute;left:44%;top:130px;transform:rotate(-16deg);border:5px double;border-radius:50%;width:150px;height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:20px;line-height:1.1;opacity:.55;padding:14px}
.s-menunggu{color:#e08a1e}.s-dibayar{color:#2aa33a}.s-lunas{color:#1f6fd0}
.empty{color:var(--mut);padding:30px;text-align:center}
@media print{body{background:#fff}header,.ed,.side,.noprint{display:none!important}main{display:block;padding:0}
#paper{border:0;min-width:0;padding:0}.wrap{overflow:visible}.card{border:0;padding:0;background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}:root{padding:0}}
</style></head><body>
<header><h1>Invoice Megrashy WO</h1>
<button class="g" onclick="newInv()">+ Klien baru</button>
<button class="g" onclick="tgl('setP')">Pengaturan</button>
<button class="g" onclick="tgl('bakP')">Backup</button>
<button onclick="window.print()">Cetak / PDF</button></header>
<div id="setP" class="card noprint" style="display:none;margin:12px"></div>
<div id="bakP" class="card noprint" style="display:none;margin:12px">
<label>Backup: salin teks ini dan simpan. Untuk memulihkan, tempel teks backup lalu tekan Muat.</label>
<textarea id="bak" rows="5"></textarea>
<div style="margin-top:6px;display:flex;gap:8px"><button class="g" onclick="exp()">Ambil data</button><button onclick="imp()">Muat</button></div></div>
<main>
<div class="card side"><b id="cnt"></b><input id="q" placeholder="Cari klien…" oninput="rList()" style="margin-top:8px"><div id="list"></div></div>
<div class="card ed" id="ed"></div>
<div class="card"><div class="wrap"><div id="paper"></div></div></div>
</main>
<script>
const KEY='megrashy_invoices_v1',MAX=50;
const DEF={set:{name:'Megrashy WO',addr:'Podomoro Park, Cluster Fashagriya 7 no.3\nBojongsoang, Bandung\nJawa Barat, 40287',bank:'Bank BCA (IDR), No.Rek : 7751187070, A/N : Alifia Meta Zakiatin\nBank Mandiri (IDR), No.Rek : 1300010270828, A/N : Alifia Meta Zakiatin'},inv:[],sel:null,n:0};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||DEF}catch(e){S=DEF}
const $=i=>document.getElementById(i);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fmt=n=>'IDR '+new Intl.NumberFormat('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.abs(n));
const money=n=>n<0?'('+fmt(n)+')':fmt(n);
const fd=s=>s?new Date(s+'T00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}):'-';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const cur=()=>S.inv.find(i=>i.id===S.sel);
const val=x=>(x.disc||(+x.amt||0)<0)?-Math.abs(+x.amt||0):(+x.amt||0);
const tot=i=>i.items.reduce((a,x)=>a+val(x),0);
const paid=i=>i.pays.filter(p=>p.st==='Sukses').reduce((a,x)=>a+(+x.amt||0),0);
const st=i=>i.ov&&i.ov!=='auto'?i.ov:(i.bill?'menunggu':paid(i)<=0?'menunggu':(paid(i)>=tot(i)&&tot(i)>0?'lunas':'dibayar'));
const LB={menunggu:'MENUNGGU PEMBAYARAN',dibayar:'SUDAH DIBAYAR',lunas:'LUNAS'};
const today=()=>new Date().toISOString().slice(0,10);
function tgl(id){const e=$(id);e.style.display=e.style.display==='none'?'block':'none';if(id==='setP')rSet()}
function newInv(){if(S.inv.length>=MAX){alert('Maksimal '+MAX+' klien. Hapus klien lama atau backup dulu.');return}
S.n++;const i={id:'k'+Date.now(),no:'INV'+String(S.n).padStart(6,'0'),nama:'',hp:'',paket:'Wedding Package',tgl:today(),tempo:'',ov:'auto',items:[{name:'',amt:0}],pays:[]};
S.inv.unshift(i);S.sel=i.id;save();all()}
function del(){if(confirm('Hapus invoice klien ini?')){S.inv=S.inv.filter(i=>i.id!==S.sel);S.sel=S.inv[0]?.id||null;save();all()}}
function pick(id){S.sel=id;save();all()}
function f(k,v){cur()[k]=v;save();rList();rPrev()}
function it(n,k,v){cur().items[n][k]=k==='amt'?+v:v;save();rList();rPrev()}
function pm(n,k,v){cur().pays[n][k]=k==='amt'?+v:v;save();rList();rPrev()}
function addIt(){cur().items.push({name:'',amt:0});save();rEd()}
function addDisc(){cur().items.push({name:'Diskon',amt:0,disc:true});save();rEd()}
function rmIt(n){cur().items.splice(n,1);save();all()}
function addPay(){const i=cur();i.pays.push({kode:'',amt:0,date:today(),met:'Tunai',st:'Sukses',note:'Termin '+(i.pays.length+1)});save();rEd();rList();rPrev()}
function rmPay(n){cur().pays.splice(n,1);save();all()}
function newBill(){const i=cur(),d=new Date();d.setDate(d.getDate()+5);i.bill={kode:'',amt:Math.max(tot(i)-paid(i),0),tgl:today(),exp:d.toISOString().slice(0,10),note:'Termin '+(i.pays.length+1)};save();all()}
function bl(k,v){cur().bill[k]=k==='amt'?+v:v;save();rList();rPrev()}
function rmBill(){cur().bill=null;save();all()}
function payBill(){const i=cur(),b=i.bill;i.pays.push({kode:b.kode,amt:b.amt,date:today(),met:'Tunai',st:'Sukses',note:b.note});i.tgl=today();i.tempo='';i.ov='auto';i.bill=null;save();all()}
function rList(){const q=$('q').value.toLowerCase();$('cnt').textContent='Klien: '+S.inv.length+' / '+MAX;
$('list').innerHTML=S.inv.filter(i=>(i.nama+i.no).toLowerCase().includes(q)).map(i=>{const s=st(i);return`<div class="li ${i.id===S.sel?'on':''}" onclick="pick('${i.id}')"><b>${esc(i.nama)||'(tanpa nama)'}</b><small>${esc(i.no)} · sisa ${fmt(tot(i)-paid(i))}</small><br><span class="bd b-${s}">${LB[s]}</span></div>`}).join('')||'<div class="empty">Belum ada klien</div>'}
function rEd(){const i=cur();if(!i){$('ed').innerHTML='<div class="empty">Tekan “+ Klien baru” untuk membuat invoice.</div>';return}
$('ed').innerHTML=`<div class="g2"><div><label>No. invoice</label><input value="${esc(i.no)}" oninput="f('no',this.value)"></div>
<div><label>Status stempel</label><select onchange="f('ov',this.value)">${[['auto','Otomatis (dari pembayaran)'],['menunggu','Menunggu pembayaran'],['dibayar','Sudah dibayar'],['lunas','Lunas']].map(o=>`<option value="${o[0]}" ${i.ov===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
<div><label>Nama klien</label><input value="${esc(i.nama)}" oninput="f('nama',this.value)"></div>
<div><label>No. HP / WA</label><input value="${esc(i.hp)}" oninput="f('hp',this.value)"></div>
<div><label>Waktu tagihan</label><input type="date" value="${i.tgl}" oninput="f('tgl',this.value)"></div>
<div><label>Jatuh tempo</label><input type="date" value="${i.tempo}" oninput="f('tempo',this.value)"></div></div>
<label style="margin-top:8px">Judul invoice</label><input value="${esc(i.paket)}" oninput="f('paket',this.value)">
<h3>Rincian tagihan (diskon: isi nominal biasa, otomatis mengurangi)</h3>
${i.items.map((x,n)=>`<div class="row"><input placeholder="Item tagihan" value="${esc(x.name)}" oninput="it(${n},'name',this.value)"><input type="number" placeholder="${x.disc||x.amt<0?'Nominal diskon (mengurangi)':'Jumlah'}" value="${x.amt}" oninput="it(${n},'amt',this.value)"><button class="x" onclick="rmIt(${n})">✕</button></div>`).join('')}
<button class="g" onclick="addIt()">+ Item</button> <button class="g" onclick="addDisc()">+ Diskon</button>
<h3>Tagihan baru (termin yang harus dibayar sekarang)</h3>
${i.bill?`<div class="prow"><div class="g2"><div><label>Kode tagihan</label><input value="${esc(i.bill.kode)}" oninput="bl('kode',this.value)"></div>
<div><label>Jumlah yang ditagih</label><input type="number" value="${i.bill.amt}" oninput="bl('amt',this.value)"></div>
<div><label>Waktu tagihan</label><input type="date" value="${i.bill.tgl}" oninput="bl('tgl',this.value)"></div>
<div><label>Waktu kadaluarsa</label><input type="date" value="${i.bill.exp}" oninput="bl('exp',this.value)"></div></div>
<label style="margin-top:6px">Catatan</label><input value="${esc(i.bill.note)}" oninput="bl('note',this.value)">
<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button onclick="payBill()">✓ Tandai sudah dibayar</button><button class="x" onclick="rmBill()">Hapus tagihan</button></div></div>`:`<button class="g" onclick="newBill()">+ Buat tagihan baru</button><div style="font-size:12px;color:var(--mut);margin-top:4px">Jumlah terisi otomatis dengan sisa tagihan, bisa diubah.</div>`}
<h3>Riwayat pembayaran (termin 1, 2, 3, …)</h3>
${i.pays.map((p,n)=>`<div class="prow"><div class="g2"><div><label>Tanggal bayar</label><input type="date" value="${p.date}" oninput="pm(${n},'date',this.value)"></div>
<div><label>Jumlah</label><input type="number" value="${p.amt}" oninput="pm(${n},'amt',this.value)"></div>
<div><label>Metode</label><select onchange="pm(${n},'met',this.value)">${['Tunai','Transfer','QRIS','Lainnya'].map(m=>`<option ${p.met===m?'selected':''}>${m}</option>`).join('')}</select></div>
<div><label>Status</label><select onchange="pm(${n},'st',this.value)">${['Sukses','Menunggu'].map(m=>`<option ${p.st===m?'selected':''}>${m}</option>`).join('')}</select></div>
<div><label>Kode (opsional)</label><input value="${esc(p.kode)}" oninput="pm(${n},'kode',this.value)"></div>
<div><label>Catatan</label><input value="${esc(p.note)}" oninput="pm(${n},'note',this.value)"></div></div>
<button class="x" onclick="rmPay(${n})">Hapus pembayaran</button></div>`).join('')}
<button class="g" onclick="addPay()">+ Tambah pembayaran</button>
<div style="margin-top:14px"><button class="x" onclick="del()">Hapus invoice ini</button></div>`}
function rPrev(){const i=cur();if(!i){$('paper').innerHTML='<div class="empty">Pratinjau invoice</div>';return}
const s=st(i),T=tot(i),P=paid(i),c=S.set,B=i.bill;
$('paper').innerHTML=`<div class="hd"><div style="color:#c98f5a;font-weight:700;font-size:16px">${esc(c.name)}</div><div class="co"><h2>${esc(c.name)}</h2>${nl(c.addr)}</div></div>
<div class="hd" style="margin-top:18px"><div class="box"><b>INVOICE ${esc(i.paket.toUpperCase())} ${esc(i.no)}</b><br>Waktu Tagihan : ${fd(B?B.tgl:i.tgl)}<br>Waktu Jatuh Tempo : ${fd(B?B.exp:i.tempo)}<br>Waktu Pembayaran : ${!B&&P>0?fd(i.pays.filter(p=>p.st==='Sukses').map(p=>p.date).sort().pop()):'-'}</div>
<div class="co"><b>KEPADA</b><br>${esc(i.nama)||'-'}<br>${esc(i.hp)}</div></div>
<div class="stamp s-${s}">${LB[s]}</div>
${B?`<p><b>Tagihan Baru Memerlukan Pembayaran</b></p><table><tr><th>Kode</th><th>Jumlah</th><th>Waktu Tagihan</th><th>Waktu Kadaluarsa</th><th>Catatan</th></tr><tr><td>${esc(B.kode)}</td><td class="r">${fmt(+B.amt||0)}</td><td style="text-align:center">${fd(B.tgl)}</td><td style="text-align:center">${fd(B.exp)}</td><td style="text-align:center">${esc(B.note)}</td></tr></table>`:''}
<p><b>Rincian Transaksi</b></p>
<table><tr><th>Item Tagihan</th><th style="width:170px">Jumlah Tagihan</th></tr>
${i.items.map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${money(val(x))}</td></tr>`).join('')}
<tr class="tot"><td>Total Tagihan</td><td class="r">${money(T)}</td></tr><tr class="tot"><td>Pembayaran Diterima</td><td class="r">${money(P)}</td></tr><tr class="tot"><td>Kekurangan Pembayaran</td><td class="r">${money(Math.max(T-P,0))}</td></tr></table>
<p><b>Riwayat Pembayaran Dilakukan</b></p>
<table><tr><th>Kode</th><th>Jumlah</th><th>Waktu Pembayaran</th><th>Metode</th><th>Status</th><th>Catatan</th></tr>
${i.pays.map(p=>`<tr><td>${esc(p.kode)}</td><td class="r">${fmt(+p.amt||0)}</td><td style="text-align:center">${fd(p.date)}</td><td style="text-align:center">${esc(p.met)}</td><td style="text-align:center">${esc(p.st)}</td><td>${esc(p.note)}</td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:#999">Belum ada pembayaran</td></tr>'}</table>
<p style="margin-top:18px"><b>Untuk pembayaran melalui transfer dapat ditujukan ke :</b><br>${nl(c.bank)}</p>`}
function rSet(){const c=S.set;$('setP').innerHTML=`<label>Nama usaha</label><input value="${esc(c.name)}" oninput="S.set.name=this.value;save();rPrev()">
<label style="margin-top:8px">Alamat</label><textarea rows="3" oninput="S.set.addr=this.value;save();rPrev()">${esc(c.addr)}</textarea>
<label style="margin-top:8px">Info rekening pembayaran</label><textarea rows="3" oninput="S.set.bank=this.value;save();rPrev()">${esc(c.bank)}</textarea>`}
function exp(){$('bak').value=JSON.stringify(S);$('bak').select()}
function imp(){try{const d=JSON.parse($('bak').value);if(!d.inv)throw 0;S=d;save();all();alert('Data dimuat.')}catch(e){alert('Teks backup tidak valid.')}}
function all(){rList();rEd();rPrev()}
all();
</script></body></html>
